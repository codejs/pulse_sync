[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in. Not ~/.cargo/bin: most users
# aren't Rust developers.
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Build the web UI before each binary build (it's embedded via `embed-web`)
github-build-setup = "../build-setup.yml"
# Homebrew formula lives in a separate tap repo: brew install codejs/tap/pulse-sync
tap = "codejs/homebrew-tap"
publish-jobs = ["homebrew"]
